<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CforCode</title>
    <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRi2US0LNAcSnlT_o4cPLtU3J2JDnACDZatDH3Gp__pMg&s=10">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
        }

        .logo {
            max-width: 250px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            text-align: center;
        }

        .card {
            background-color: #ffffff;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 20px 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.4rem;
            color: #444;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            padding: 12px 20px;
            font-size: 1rem;
            color: #ffffff;
            background-color: #007bff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <img src="https://raw.githubusercontent.com/progra31/clem_site/0175baecfc2932a7bdb549834f007b05d973f68d/icones/logo%20principal.png" alt="Logo CforCode" class="logo">

    <h1>Bienvenue sur le site officiel de <strong>CforCode</strong></h1>
    
    <div class="card">
        <h2>Projets</h2>
        <div class="button-container">
            <a href="https://progra31.github.io/clem_site/xp-computer/" class="btn">ordinateur web</a>
            <a href="https://progra31.github.io/clem_site/super-pannel" class="btn">super pannel</a>
            <a href="https://progra31.github.io/clem_site/code-editor/" class="btn">CforCodeEditor</a>
        </div>
    </div>

</body>
</html>
