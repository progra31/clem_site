<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CforCode</title>
    <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRi2US0LNAcSnlT_o4cPLtU3J2JDnACDZatDH3Gp__pMg&s=10">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
        }

        .logo {
            max-width: 250px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            text-align: center;
        }

        .card {
            background-color: #ffffff;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 20px 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.4rem;
            color: #444;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            font-size: 1rem;
            color: #ffffff;
            background-color: #007bff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .btn-icon {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            object-fit: contain;
        }

        /* Indicateur de version en bas à gauche */
        #version-checker {
            position: fixed;
            bottom: 20px;
            left: 20px;
            cursor: pointer;
            z-index: 1000;
            background: white;
            padding: 8px;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        #version-checker:hover {
            transform: scale(1.1);
        }

        #version-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            display: block;
        }

        /* Fenêtre modale d'erreur */
        #error-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
        }

        .modal-content h3 {
            margin-top: 0;
            color: #d9534f;
        }

        .modal-content p {
            font-size: 0.95rem;
            color: #555;
            word-break: break-word;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-retry {
            background-color: #007bff;
            color: white;
        }

        .btn-retry:hover {
            background-color: #0056b3;
        }

        .btn-close {
            background-color: #6c757d;
            color: white;
        }

        .btn-close:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <!-- Indicateur de version en bas à gauche -->
    <div id="version-checker" onclick="handleVersionClick()" title="Vérifier les mises à jour">
        <img id="version-icon" src="https://raw.githubusercontent.com/progra31/clem_site/e991b2fd1d0c616cd6bf50fdaaaae8d1287cd8c9/icones/status-version-check/checking-version.png" alt="Statut de version">
    </div>

    <!-- Fenêtre modale d'erreur -->
    <div id="error-modal">
        <div class="modal-content">
            <h3>Échec de la vérification</h3>
            <p id="error-details">Une erreur est survenue lors de la vérification de la version.</p>
            <div class="modal-buttons">
                <button class="btn-retry" onclick="retryFromModal()">Relancer</button>
                <button class="btn-close" onclick="closeModal()">Fermer</button>
            </div>
        </div>
    </div>

    <img src="https://raw.githubusercontent.com/progra31/clem_site/0175baecfc2932a7bdb549834f007b05d973f68d/icones/logo%20principal.png" alt="Logo CforCode" class="logo">

    <h1>Bienvenue sur le site officiel de <strong>CforCode</strong></h1>
    
    <div class="card">
        <h2>Projets</h2>
        <div class="button-container">
            <a href="https://progra31.github.io/clem_site/xp-computer/" class="btn">
                <img src="https://raw.githubusercontent.com/progra31/clem_site/b9cf8c15137952f12ed20a31a24230dee62666df/icones/icone%20ordi%20web.png" alt="" class="btn-icon">
                ordinateur web
            </a>
            <a href="https://progra31.github.io/clem_site/super-pannel" class="btn">
                <img src="https://raw.githubusercontent.com/progra31/clem_site/405ac6c2ca93b54c8bbb102df28352e79bc2e100/icones/icone%20super%20pannel.png" alt="" class="btn-icon">
                super pannel
            </a>
            <a href="https://progra31.github.io/clem_site/code-editor/" class="btn">
                <img src="https://raw.githubusercontent.com/progra31/clem_site/29b96fa79e3ae469d712bdf98046345462d7789c/icones/code%20editor%20icone.png" alt="" class="btn-icon">
                CforCodeEditor
            </a>
        </div>
    </div>

    <script>
        const CURRENT_VERSION = "v1.0.0";
        const baseUrl = "https://raw.githubusercontent.com/progra31/clem_site/e991b2fd1d0c616cd6bf50fdaaaae8d1287cd8c9/icones/status-version-check/";
        
        const icons = {
            checking: baseUrl + "checking-version.png",
            right: baseUrl + "right-version.png",
            wrong: baseUrl + "wrong-version.png",
            cant: baseUrl + "cant-check.png"
        };

        let currentState = "checking";
        let lastErrorMessage = "";

        async function checkForUpdates() {
            const iconElement = document.getElementById("version-icon");
            iconElement.src = icons.checking;
            currentState = "checking";

            // Création d'un contrôleur pour limiter le temps de recherche à 15 secondes
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);

            try {
                const response = await fetch('https://api.github.com/repos/progra31/clem_site/releases/latest', {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (!response.ok) {
                    throw new Error(`Erreur HTTP : ${response.status} ${response.statusText}`);
                }
                
                const data = await response.json();
                const latestVersion = data.tag_name;

                if (latestVersion && latestVersion !== CURRENT_VERSION) {
                    iconElement.src = icons.wrong;
                    currentState = "wrong";
                    document.getElementById("version-checker").title = "Une mise à jour est disponible ! Cliquez pour actualiser.";
                } else {
                    iconElement.src = icons.right;
                    currentState = "right";
                    document.getElementById("version-checker").title = "Le site est à jour. Cliquez pour revérifier.";
                }
            } catch (error) {
                clearTimeout(timeoutId);
                console.error("Impossible de vérifier les mises à jour :", error);
                
                if (error.name === 'AbortError') {
                    lastErrorMessage = "La requête a pris trop de temps (délai de 15 secondes dépassé).";
                } else {
                    lastErrorMessage = error.message;
                }

                iconElement.src = icons.cant;
                currentState = "cant";
                document.getElementById("version-checker").title = "Impossible de vérifier la version. Cliquez pour voir les détails.";
            }
        }

        function handleVersionClick() {
            if (currentState === "wrong") {
                // Si le site n'est pas à jour, actualiser l'onglet
                location.reload(true);
            } else if (currentState === "cant") {
                // Si l'échec est survenu, ouvrir la fenêtre modale avec les détails
                document.getElementById("error-details").textContent = lastErrorMessage;
                document.getElementById("error-modal").style.display = "flex";
            } else {
                // Sinon (right ou checking), lancer une nouvelle recherche manuelle
                checkForUpdates();
            }
        }

        function closeModal() {
            document.getElementById("error-modal").style.display = "none";
        }

        function retryFromModal() {
            closeModal();
            checkForUpdates();
        }

        // Lancer la vérification au chargement de la page
        checkForUpdates();

        // Vérification automatique toutes les 1 minute (60000 ms)
        setInterval(checkForUpdates, 60000);
    </script>
</body>
</html>
