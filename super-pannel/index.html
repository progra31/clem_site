<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bureau Interactif & HUD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Menu latéral -->
  <aside id="sidebar">
    <h2>Modules HUD</h2>
    <div class="module-toggle">
      <label>
        <input type="checkbox" data-module="fps"> Compteur de FPS
      </label>
    </div>
    <div class="module-toggle">
      <label>
        <input type="checkbox" data-module="specs"> Specs de l'appareil
      </label>
    </div>
    <div class="module-toggle">
      <label>
        <input type="checkbox" data-module="keyboard"> Tracker Clavier
      </label>
    </div>
    <div class="module-toggle">
      <label>
        <input type="checkbox" data-module="mouse"> Tracker Souris
      </label>
    </div>
  </aside>

  <!-- Zone Bureau -->
  <main id="desk">
    <!-- Fournitures de bureau -->
    <div class="supply notepad">
      <div class="notepad-header"></div>
      <div class="notepad-lines">
        <p>Notes du jour...</p>
      </div>
    </div>

    <div class="supply pen-holder">
      <div class="pen pen-blue"></div>
      <div class="pen pen-red"></div>
      <div class="pen pen-yellow"></div>
    </div>

    <div class="supply coffee-mug">
      <div class="coffee"></div>
    </div>

    <div class="supply sticky-note">
      <p>HUD à activer ➔</p>
    </div>
  </main>

  <!-- Conteneur global pour les overlays HUD -->
  <div id="hud-overlay"></div>

  <!-- Scripts des modules -->
  <script src="module-fps.js"></script>
  <script src="module-spec.js"></script>
  <script src="module-keyboard-tracker.js"></script>
  <script src="module-mouse-tracker.js"></script>

  <!-- Script principal -->
  <script src="script.js"></script>
</body>
</html>
